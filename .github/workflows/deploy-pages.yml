name: Deploy Project Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build Next.js static site
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /Crunch
        run: npm run build

      - name: Bundle classic admin under /classic
        run: |
          mkdir -p web/out/classic/assets web/out/classic/data web/out/classic/scripts
          cp index.html app.js styles.css auth.js config.js persist.js map-globe.js .nojekyll web/out/classic/
          cp -R assets/. web/out/classic/assets/
          cp -R data/. web/out/classic/data/
          cp -R scripts/. web/out/classic/scripts/
          python3 - <<'PY'
          from pathlib import Path
          html = Path('web/out/classic/index.html')
          text = html.read_text()
          html.write_text(text)
          print('classic admin bundled')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
