name: Deploy Project Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build Next.js static site
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /Crunch
        run: npm run build

      - name: Bundle classic admin under /classic
        run: |
          mkdir -p web/out/classic/assets web/out/classic/data web/out/classic/scripts
          cp index.html app.js styles.css auth.js config.js persist.js map-globe.js .nojekyll web/out/classic/
          cp -R assets/. web/out/classic/assets/
          cp -R data/. web/out/classic/data/
          cp -R scripts/. web/out/classic/scripts/
          touch web/out/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/out
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
